name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Bash syntax
        run: find install.sh lib tasks tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck
        run: find install.sh lib tasks tests -type f -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Unit tests
        run: |
          for test_file in tests/unit/*.sh; do
            bash "${test_file}"
          done
      # The configurator uses only the standard library, so no dependency step:
      # if it needed one, it could not run on the Arch ISO as shipped.
      - name: Configurator compiles
        run: python3 -m compileall -q configurator
      - name: Configurator tests
        run: python3 -m unittest discover -s tests/python -v
      # Round-trip guard: the menu writes Bash that lib/config.sh sources, so a
      # generated file that the shell rejects is a broken contract between the
      # two halves, not a cosmetic problem.
      - name: Generated configuration is accepted by the shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from configurator.config import Configuration
          config = Configuration.load(Path('config/system.conf'))
          config.memory_mib = 8 * 1024
          config.set_hibernation(True)
          config.save(Path('config/generated.conf'))
          PY
          cat config/generated.conf
          bash -c '
            source lib/logging.sh
            source lib/common.sh
            source lib/commands.sh
            source lib/config.sh
            validate_timezone() { return 0; }
            load_config
          '
